/* ===================== Tạo Giấy ĐNTT ===================== */
S.dn = { contentMan: null, profile: '', tpc: false, file: null, outName: '', gd: '', cv: '', year: '', month: '', dot: '', result: null };
function dnContent(d, partial) {
  const t = v => String(v == null ? '' : v).trim(), p = d.profile; let c = '', ok = true;
  if (p === 'FHVI') { const g = t(d.gd).replace(/^GIAI\s*ĐOẠN\s*:?\s*/i, '').replace(/\s*[–-]?\s*PJICO\s*TDU\s*$/i, '').trim(); ok = !!g; c = `GIAI ĐOẠN ${g} – PJICO TDU`; }
  else if (p === 'INS') { const n = t(d.cv).replace(/^CV\s*/i, '').replace(/\s*PJICO\s*\/\s*\d{4}\s*$/i, '').trim(), y = t(d.year); ok = !!n && /^\d{4}$/.test(y); c = `CV ${n} PJICO/${y}`; }
  else if (p === 'PPY') { const m = t(d.month).replace(/^THÁNG\s*/i, '').trim(), cv = ppyNum(d.cv), y = t(d.year); ok = ppyOk(cv, y, m); c = `PJICO hoàn quỹ bồi thường tháng ${m}/${y} – HQ/PJICO/${cv}-${y}`; }
  else { const y = t(d.year), n = t(d.cv).replace(/^CV\s*/i, '').replace(/\s*\/?\s*FPT\s*IS\s*$/i, '').replace(/\s*\/\s*(\d{4}|\d{2})\s*$/, '').trim(); ok = !!n && /^(\d{2}|\d{4})$/.test(y); c = `CV ${n}/${y}/FPT IS`; }
  if (!ok && !partial) return null; return withTpc(c, d.tpc);
}
const dnPay = p => (DB.settings && DB.settings.dntt && DB.settings.dntt[p]) || (DEFAULT_DNTT[p]) || { name: '', account: '', bank: '' };
RENDER.dntt = () => {
  const d = S.dn, r = d.result, p = d.profile, pay = dnPay(p);
  const f = p === 'FHVI' ? fld('Giai đoạn', inp('dn.gd', 'VD: 29.10 - 31.10.26', 'data-change="fhviFix"'), 'full')
    : p === 'INS' ? fld('Số CV', inp('dn.cv')) + fld('Năm', inp('dn.year', '4 chữ số'))
    : p === 'PPY' ? fld('Tháng thanh toán', inp('dn.month')) + fld('Số CV', inp('dn.cv', 'VD: 537-2026'))
    : fld('Nội dung thay đổi', inp('dn.cv', 'VD: 1820')) + fld('Năm', inp('dn.year', '2 hoặc 4 chữ số'));
  return `<div class="two"><div class="panel" data-scope="dn"><div class="grid">${fld('TPA', `<select class="in" data-k="dn.profile" data-r="1">${optHTML(TPAS, p)}</select>`)}${f}
  ${filePick('dn.file', 'File Bảng kê')}${fld('Tên file Word (để trống sẽ tự lấy từ tên BK)', inp('dn.outName'), 'full')}</div>
  <div class="bar" style="margin:12px 0">${chk('dn.tpc', 'TPC', true)}</div>
  <div class="box"><div class="mut sm">Nội dung thanh toán:</div><div class="prev" id="pvDn">${esc(dnContent(d, true))}</div>
  ${r && r.total ? `<div class="mut sm">Số tiền:</div><div class="prev">${money(r.total)} đồng</div><div class="mut sm">Bằng chữ:</div><div class="prev">${esc(moneyWords(r.total))}</div>` : ''}</div>
  <div class="act"><button class="btn ok" data-enter-btn data-act="dnGo">Tạo Giấy ĐNTT</button> ${r && r.u8 ? '<button class="btn pri" data-act="dnDl">Tải file Word</button>' : ''}</div></div>
  <div>${r ? `<div class="panel"><h3>Kết quả</h3>${r.msgs.map(m => `<p class="${m.cls || ''}">${esc(m.t)}</p>`).join('')}</div>` : ''}<div class="panel"><p class="mut sm">Thông tin người thụ hưởng lấy từ <b>Cài đặt</b> (sửa được). Ngày văn bản là ngày hôm nay. Số tiền lấy từ dòng TỔNG CỘNG của bảng kê.</p></div></div></div>`;
};
ACT.dnDl = () => { const r = S.dn.result; if (r && r.u8) download(r.u8, r.name, 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'); };
function bkTotal(rows) {
  let hi = -1, cm = -1, cs = -1;
  for (let i = 0; i < Math.min(60, rows.length); i++) { const h = (rows[i] || []).map(x => hk(x)); const a = h.indexOf('SOTIEN'), b = h.indexOf('STT'); if (a >= 0 && b >= 0) { hi = i; cm = a; cs = b; break; } }
  if (hi < 0) return { err: 'Không tìm thấy dòng tiêu đề có cả STT và Số tiền trong bảng kê.' };
  const num = v => { if (typeof v === 'number') return v; const n = Number(String(v == null ? '' : v).replace(/[\s,]/g, '')); return isFinite(n) && String(v).trim() !== '' ? n : NaN; };
  let total = 0;
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i] || []; if (!r.some(x => /TỔNG\s*CỘNG/i.test(String(x == null ? '' : x)))) continue;
    const a = num(r[cm]); if (a > 0) { total = a; break; } for (let j = r.length - 1; j >= 0; j--) { const v = num(r[j]); if (v > 0) { total = v; break; } } if (total) break;
  }
  if (!total) { let s = 0; for (let i = hi + 1; i < rows.length; i++) { const r = rows[i] || []; const st = num(r[cs]), v = num(r[cm]); if (st > 0 && isFinite(v)) s += v; } total = s; }
  let n = 0; for (let i = hi + 1; i < rows.length; i++) { const r = rows[i] || []; if (r.some(x => /TỔNG\s*CỘNG/i.test(String(x == null ? '' : x)))) break; if (num(r[cs]) > 0) n++; }
  return total > 0 ? { total, n } : { err: 'Chưa xác định được số tiền TỔNG CỘNG trong bảng kê.' };
}
/* ---- Điền nội dung vào mẫu Word (mẫu mặc định hoặc mẫu người dùng tải lên ở Cài đặt) ---- */

  return `<div class="steps">${STEPS.map((k, i) => `<button class="step${S.tab === k ? ' on' : ''}${done[k] ? ' done' : ''}" data-act="tab" data-v="${k}"><span class="sn">${done[k] ? '✓' : i + 1}</span>${L[k]}</button>${i < 2 ? '<span class="arr">→</span>' : ''}`).join('')}<span class="mut sm" style="margin-left:auto">TPA, TPC, Giai đoạn và INS/PPY được đồng bộ giữa 3 bước; mỗi bước vẫn chọn file riêng.</span></div>`;
}
/* Đồng bộ trường dùng chung giữa Chuyển đổi / Bảng kê / ĐNTT (chỉ trường cùng định dạng) */
/* Đổi TPA: lấy giá trị ở Thông tin chung (nguồn chuẩn) ghi lại cho Bảng kê và ĐNTT để không dính số của TPA trước */
function xlPushShared() {
  const c = S.conv, p = c.profile, set = (f, v) => { S.bk[f] = v; S.dn[f] = v; };
  if (p === 'INS') { set('cv', c.insCv); set('year', c.insYear); }
  else if (p === 'PPY') { set('cv', c.ppyNo); set('year', c.ppyYear); set('month', c.ppyMonth); set('dot', c.ppyDot); }
  else if (p === 'FPTIS') { S.dn.cv = S.bk.cv; S.dn.year = S.bk.year; }
}
function syncShared(k) { syncSharedRaw(k); livePrev(); }
function syncSharedRaw(k) {
  if (!k) return; const m = /^(conv|bk|dn)\.(.+)$/.exec(k); if (!m) return;
  const grp = { conv: 'conv', bk: 'bk', dn: 'dn' }, canon = { profile: { conv: 'profile', bk: 'profile', dn: 'profile' }, tpc: { conv: 'tpc', bk: 'tpc', dn: 'tpc' }, gd: { conv: 'gd', bk: 'gd', dn: 'gd' } };
  let kind = null; for (const c in canon) if (canon[c][m[1]] === m[2]) kind = c;
  const insMap = { conv: { cv: 'insCv', year: 'insYear' }, bk: { cv: 'cv', year: 'year' }, dn: { cv: 'cv', year: 'year' } };
  const ppyMap = { conv: { no: 'ppyNo', year: 'ppyYear', month: 'ppyMonth', dot: 'ppyDot' }, bk: { no: 'cv', year: 'year', month: 'month', dot: 'dot' }, dn: { no: 'cv', year: 'year', month: 'month', dot: 'dot' } };
  const v = getPath(S, k), cur = S[m[1] === 'dn' ? 'dn' : m[1]], prof = cur.profile;
  const put = (t, f) => { if (t !== m[1]) setPath(S, (t === 'dn' ? 'dn' : t) + '.' + f, v); };
  if (kind) { for (const t of ['conv', 'bk', 'dn']) put(t, canon[kind][t]); if (kind === 'profile') { xlPushShared(); xlManClear(); } return; }
  const fptMap = { conv: {}, bk: { cv: 'cv', year: 'year' }, dn: { cv: 'cv', year: 'year' } };
  for (const [mp, ok] of [[insMap, prof === 'INS'], [ppyMap, prof === 'PPY'], [fptMap, prof === 'FPTIS']]) {
    if (!ok) continue; const back = Object.entries(mp[m[1]]).find(([, f]) => f === m[2]); if (!back) continue;
    for (const t of ['conv', 'bk', 'dn']) if (t !== m[1] && mp[t] && mp[t][back[0]]) put(t, mp[t][back[0]]);
  }
}
ACT.globalSearch = v => {
  v = String(v || '').trim(); if (!v) return;
  const f = emptySrF(); if (/\//.test(v)) f.policyNo = v; else if (/\d/.test(v) && /[-\d]/.test(v) && !/\s/.test(v)) f.claimNo = v; else f.insured = v;
  S.search.f = f; S.search.applied = { ...f }; S.search.page = 1; S.search.sel = {}; S.search.all = false; S.search.expanded = false; ACT.tab('search');
};
ACT.homePend = () => { const e = document.getElementById('homePend'); if (e) { e.scrollIntoView({ behavior: 'smooth', block: 'start' }); e.classList.remove('flash'); void e.offsetWidth; e.classList.add('flash'); } };
RENDER.home = () => {
  const rows = (DB.tracker && DB.tracker.rows) || [], claims = (DB.claims && DB.claims.rows) || [];
  const open = rows.map(r => ({ r, d: trkDerived(r) })).filter(x => !x.d.finished);
  const late = open.filter(x => x.d.display === 'Trễ'), near = open.filter(x => x.d.display !== 'Trễ' && x.d.days >= 4);
  const noBk = open.filter(x => ['Mới tiếp nhận', 'Đang xử lý', 'Chờ bổ sung'].includes(x.r.status));
  const miss = { 'CCCD': 0, 'DOB': 0, 'Chẩn đoán': 0 }; for (const c of claims) { if (!String(c.identityNo || '').trim()) miss['CCCD']++; if (!String(c.dob || '').trim()) miss['DOB']++; if (!String(c.diagnosis || '').trim()) miss['Chẩn đoán']++; }
  const missAny = claims.filter(c => !String(c.identityNo || '').trim() || !String(c.dob || '').trim() || !String(c.diagnosis || '').trim()).length;
  const card = (n, label, cls, act, v) => `<button class="hc ${cls}" ${act ? `data-act="${act}" data-v="${v || ''}"` : ''}><b>${n}</b><span>${label}</span></button>`;
  const top = [...late, ...near].sort((a, b) => b.d.days - a.d.days).slice(0, 8);
  const pend = rows.filter(r => r.pending && r.pending.length).sort((a, b) => a.receivedDate < b.receivedDate ? 1 : -1), pendN = pend.reduce((s, r) => s + r.pending.length, 0);
  return `<div class="hero"><div><h3>Chào ní, hôm nay làm gì?</h3><p class="mut">Mọi dữ liệu nằm trong thư mục OneDrive đã chọn. Số liệu dưới đây tính ngay trên máy, không gửi đi đâu.</p></div></div>
  <div class="hcards">${card(late.length, 'Đợt đã trễ (≥ 6 ngày làm việc)', 'red', 'tab', 'trk')}${card(near.length, 'Đợt sắp trễ (4–5 ngày)', 'yellow', 'tab', 'trk')}${card(noBk.length, 'Đợt chưa nhập HS / lập bảng kê', 'blue', 'tab', 'trk')}${card(missAny, 'Hồ sơ còn thiếu CCCD / DOB / Chẩn đoán', 'purple', 'tab', 'search')}${card(pendN, `Hồ sơ pending${pend.length ? ` (trong ${pend.length} đợt)` : ''}`, 'pend', 'homePend')}</div>
  <div class="two2"><div class="hcol"><div class="panel"><h3>Đợt cần chú ý</h3>${top.length ? dataTable(['Ngày nhận', 'TPA', 'Công văn', 'Ngày LV', 'Trạng thái'], top.map(x => `<tr class="click" data-act="tab" data-v="trk"><td>${esc(x.r.receivedDate)}</td><td>${esc(x.r.tpa)}</td><td>${esc(x.r.officialLetter)}</td><td>${x.d.days}</td><td><span class="bd ${x.d.display === 'Trễ' ? 'late' : 'wait'}">${esc(x.d.display)}</span></td></tr>`)) : '<p class="mut">Không có đợt nào trễ hoặc sắp trễ.</p>'}</div>
  <div class="panel" id="homePend"><h3>Hồ sơ pending</h3>${pend.length ? dataTable(['Ngày nhận', 'TPA', 'Công văn', 'Số HS pending', 'Trạng thái'], pend.map(r => { const d = trkDerived(r); return `<tr class="click" data-act="trkPend" data-v="${r.id}" title="Xem hồ sơ pending"><td>${esc(r.receivedDate)}</td><td>${esc(r.tpa)}</td><td>${esc(r.officialLetter)}</td><td><b class="pdn">${r.pending.length}</b></td><td><span class="bd ${trkStatCls(d.display)}">${esc(d.display)}</span></td></tr>`; })) : '<p class="mut">Không có hồ sơ pending.</p>'}</div></div>
  <div class="panel"><h3>Kho dữ liệu</h3><div class="kv"><span>Hồ sơ đã chuyển đổi</span><b>${claims.length}</b><span>Hợp đồng trong DATA</span><b>${(DB.data && DB.data.rows.length) || 0}</b><span>Đợt đang theo dõi</span><b>${rows.length}</b><span>Thiếu CCCD</span><b>${miss['CCCD']}</b><span>Thiếu DOB</span><b>${miss['DOB']}</b><span>Thiếu Chẩn đoán</span><b>${miss['Chẩn đoán']}</b></div></div></div>`;
};
function livePrev() {

  const set = (id, f) => { const e = document.getElementById(id); if (!e) return; try { if (e.tagName === 'TEXTAREA') { const k = e.dataset.v; if (S[k][XL_MAN[k][0]] == null) e.value = xlAuto(k); } else e.textContent = f() || '—'; } catch (x) { /* bỏ qua */ } };
  set('pvConv', () => { const n = convNote(convState(), true); return n && n.note; }); set('pvBk', () => bkFull(S.bk, true)); set('pvDn', () => dnContent(S.dn, true));
}

const mapCell = v => { if (v == null || v === '') return ''; const iso = typeof v === 'number' && v > 30000 && v < 80000 ? serialToISO(v) : ''; return String(iso ? fmtVN(iso) + ' (ngày)' : v).slice(0, 40); };
/* Tự tính số dòng mỗi trang để bảng vừa khít màn hình (Tìm kiếm hồ sơ, Theo dõi HS TPA) */
let fitIter = 0;
